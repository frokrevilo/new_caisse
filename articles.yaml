# ============================================================
# Artikelkonfiguration für das Kassensystem (caisse)
# Matrix-Layout: 4 Spalten (x: 0..3) × 5 Reihen (y: 0..4)
# 
# Felder pro Artikel:
#   artikelname:  Name des Artikels (z.B. "Kaffee")
#   artikelpreis: Preis in Euro (z.B. 2.50 oder 2,50)
#   farbe:        Hex-Farbwert (z.B. "#8B5A2B")
#   sichtbarkeit: true oder false
#   position:     [x, y]  oder x: ..., y: ...
# ============================================================

articles:
  # ----------------------------------------------------------
  # Spalte 0: Kaffee & Heißgetränke
  # ----------------------------------------------------------
  - artikelname: "Espresso"
    artikelpreis: 2.00
    farbe: "#6F4E37"
    sichtbarkeit: true
    position: [0, 0]

  - artikelname: "Kaffee"
    artikelpreis: 2.50
    farbe: "#8B5A2B"
    sichtbarkeit: false
    position: [0, 1]

  - artikelname: "Cappuccino"
    artikelpreis: 3.20
    farbe: "#A0522D"
    sichtbarkeit: true
    position: [0, 2]

  - artikelname: "Latte Macchiato"
